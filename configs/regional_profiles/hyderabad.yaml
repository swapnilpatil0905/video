# Regional profile: Hyderabad (Hyderabadi Hindi / Dakhni Urdu / Hinglish).
# Data only — the adaptation engine is region-agnostic. Copy this file to add another city.
#
# Rules for contributors:
# - Only REAL places belong in `locations`. Fictional businesses, buildings and addresses are
#   generated per story and always marked fictional.
# - No travel times. Distance is expressed only as zone relations (same zone / adjacent / far).
# - Expressions carry usage notes; the writer uses them only where character, emotion and context fit.

id: hyderabad
city: Hyderabad
state: Telangana
country: India
languages_heard: [Hindi, Urdu, Dakhni, Telugu, English]

dialects:
  dakhni_urdu:
    description: >-
      Dakhni Urdu / old Hyderabadi speech: Urdu-rich, relaxed rhythm, "-re" verb endings
      (kya karre, kidhar jaare), "-ku" datives (mereku, tereku, kaiku), "nakko" for no, "hau" for yes.
    accent_for_voice: "speaks Hindi with a strong Hyderabadi Dakhni accent, relaxed and expressive"
  hyderabadi_hindi:
    description: >-
      Everyday Hyderabadi Hindi: standard Hindi grammar with occasional Dakhni markers and Urdu
      words, light English code-switching. Most young urban characters.
    accent_for_voice: "speaks Hindi with a light Hyderabadi accent"
  neutral_hindi:
    description: Natural, conversational standard Hindi (no regional markers), Hinglish as fits the character.
    accent_for_voice: "speaks natural, neutral Indian Hindi"

# Dakhni / Hyderabadi expressions. register: casual | warm | rough | comic | any
# min_intensity: only characters with dialect intensity >= this use it.
expressions:
  - {roman: "Arre miyaan", devanagari: "अरे मियाँ", meaning: "hey man / come on", register: casual, min_intensity: 0.4, use: "friendly address, mild exasperation"}
  - {roman: "Kya karre?", devanagari: "क्या कर्रे?", meaning: "what are you doing?", register: casual, min_intensity: 0.5, use: "casual question among friends/family"}
  - {roman: "Nakko", devanagari: "नक्को", meaning: "no / don't", register: any, min_intensity: 0.4, use: "refusal; firm or playful"}
  - {roman: "Hau", devanagari: "हौ", meaning: "yes", register: casual, min_intensity: 0.5, use: "casual agreement"}
  - {roman: "Kaiku?", devanagari: "काइकू?", meaning: "why?", register: casual, min_intensity: 0.5, use: "why — casual or annoyed"}
  - {roman: "Kidhar jaare?", devanagari: "किधर जारे?", meaning: "where are you going?", register: casual, min_intensity: 0.5, use: "casual"}
  - {roman: "Mereku", devanagari: "मेरेकू", meaning: "to me / I (need)", register: casual, min_intensity: 0.5, use: "replaces 'mujhe'"}
  - {roman: "Tereku", devanagari: "तेरेकू", meaning: "to you", register: casual, min_intensity: 0.5, use: "replaces 'tujhe'; close or rough"}
  - {roman: "Baigan", devanagari: "बैंगन", meaning: "nonsense! (dismissive)", register: comic, min_intensity: 0.6, use: "dismissive, comic"}
  - {roman: "Hallu hallu", devanagari: "हल्लू हल्लू", meaning: "slowly, gently", register: warm, min_intensity: 0.5, use: "take it easy; caring or teasing"}
  - {roman: "Khaali-peeli", devanagari: "खाली-पीली", meaning: "for no reason", register: casual, min_intensity: 0.3, use: "pointless; also common in Mumbai"}
  - {roman: "Kya bolre?", devanagari: "क्या बोल्रे?", meaning: "what are you saying?", register: casual, min_intensity: 0.5, use: "surprise / disbelief"}
  - {roman: "Pakka", devanagari: "पक्का", meaning: "for sure", register: any, min_intensity: 0.0, use: "promise / certainty"}
  - {roman: "Ek dum", devanagari: "एकदम", meaning: "totally", register: any, min_intensity: 0.0, use: "emphasis"}

naming:
  conventions: >-
    Hyderabad is multi-community: Telugu families (surnames such as Reddy, Rao, Varma, Naidu, Goud),
    Hyderabadi Muslim families (Khan, Mirza, Siddiqui, Ahmed, Hussaini, Baig), North Indian and
    Marwari families settled in the city (Sharma, Agarwal, Malhotra, Jain), and Christian families.
    Choose a name that fits the character's family and background in THIS story; do not pick a
    community for flavour, and never stereotype.
  examples_male: [Arjun Reddy, Aditya Varma, Kabir Khan, Sameer Ahmed, Rohan Malhotra, Ayaan Mirza, Vikram Rao]
  examples_female: [Ananya Reddy, Meera Sharma, Zoya Khan, Sana Mirza, Kavya Rao, Ayesha Siddiqui, Nisha Varma]
  honorifics:
    elder_male: ["bhai (peer)", "bhaiyya", "anna (Telugu elder brother)", "chacha", "mamu", "abba / nanna (father)"]
    elder_female: ["aapa / akka (elder sister)", "baaji", "ammi / amma (mother)", "khala", "atthamma"]
    respectful: ["saab", "ji", "sir / madam (office)"]

culture:
  food: [Irani chai, Osmania biscuits, Hyderabadi biryani, haleem (Ramzan), double ka meetha, lukhmi, pathar ka gosht]
  festivals: [Bonalu, Bathukamma, Ramzan, Eid, Diwali, Sankranti, Ganesh Chaturthi]
  everyday: [auto-rickshaw haggling, Hyderabad Metro commute, ORR drives, evening walks on Necklace Road, IT office culture in HITEC City]

# Zones: distance is only ever "same zone" (near), "adjacent" (moderate) or "far".
zones:
  old_city: "south of the Musi river, heritage core"
  central: "Abids / Koti / Hussain Sagar belt"
  west_central: "Banjara Hills, Jubilee Hills, Ameerpet, Mehdipatnam, Tolichowki"
  west_it: "HITEC City, Madhapur, Gachibowli, Financial District, Kokapet"
  north: "Secunderabad, Begumpet"
  north_west: "Kukatpally, KPHB, Miyapur"
  east: "Uppal, LB Nagar, Dilsukhnagar"
  south: "Shamshabad (airport)"
adjacent_zones:
  - [old_city, central]
  - [central, west_central]
  - [central, north]
  - [central, east]
  - [west_central, west_it]
  - [west_central, north]
  - [west_central, north_west]
  - [north_west, west_it]
  - [north, north_west]
  - [old_city, east]
  - [old_city, south]

