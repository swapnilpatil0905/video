# Regional profile: Delhi Hindi.
id: delhi
city: Delhi
country: India
languages_heard:
- Hindi
- Punjabi
- English
- Urdu
dialects:
  dilli_hindi:
    description: Delhi Hindi — direct, loud warmth, "bhai", "scene kya hai", "tension mat le", Punjabi colour.
    accent_for_voice: speaks Hindi with a Delhi accent, direct and confident
  neutral_hindi:
    description: Natural Hindi with Delhi-style English mixing.
    accent_for_voice: speaks natural urban Indian Hindi
expressions:
- roman: Scene kya hai?
  devanagari: सीन क्या है?
  meaning: what's the plan/situation?
  register: casual
  min_intensity: 0.4
  use: friends
- roman: Tension mat le
  devanagari: टेंशन मत ले
  meaning: don't worry
  register: casual
  min_intensity: 0.2
  use: reassurance
- roman: Bhai sahab
  devanagari: भाई साहब
  meaning: sir / brother (respectful)
  register: any
  min_intensity: 0.0
  use: addressing a stranger
naming:
  conventions: Delhi mixes Punjabi, Baniya, Jat, Muslim, Bihari and other families; fit the story's family.
  examples_male:
  - Kabir Malhotra
  - Rohan Sethi
  - Aman Chaudhary
  - Faizan Qureshi
  examples_female:
