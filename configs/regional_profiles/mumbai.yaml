dialects:
  bambaiya:
    description: Mumbai street Hindi — "apun", "kya re", "bindaas", "waat lag gayi"; fast, clipped rhythm.
    accent_for_voice: speaks Hindi with a Mumbai (Bambaiya) accent, fast and casual
  neutral_hindi:
    description: Natural Hindi with Mumbai-style English mixing.
    accent_for_voice: speaks natural urban Indian Hindi
expressions:
- roman: Kya re
  devanagari: क्या रे
  meaning: what's up / what
  register: casual
  min_intensity: 0.4
  use: friends
- roman: Bindaas
  devanagari: बिंदास
  meaning: carefree / no worries
  register: casual
  min_intensity: 0.3
  use: reassurance
- roman: Waat lag gayi
  devanagari: वाट लग गई
  meaning: we're in trouble
  register: comic
  min_intensity: 0.5
  use: trouble, comic
- roman: Khaali-peeli
  devanagari: खाली-पीली
  meaning: for no reason
  register: casual
  min_intensity: 0.3
  use: pointless
