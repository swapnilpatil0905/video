# project_001 — Chinese short drama → Hindi remake (personal self-improvement learning project).
# Validate:  ./run.sh --project projects/project_001/config.yaml --validate-only
schema_version: 1

project:
  id: project_001
  name: chinese_drama_hindi_remake
  project_type: full_remake
  source_video: input/source.mp4          # relative to this directory (hardlinked from the legacy workspace)
  description: Midsummer short drama (zh) remade in Hindi with fictional characters and original voices.

languages:
  source: zh
  target: hi
  target_region: IN

localization:
  preserve_story: true
  cultural_adaptation: true
  natural_dialogue: true
  generate_subtitles: true
  register: colloquial                    # avoid textbook Hindi
  # Indian story adaptation (docs/specs/indian-story-adaptation.md)
  country: India
  language: Hindi
  writing_style: natural_hinglish
  regional_profile: hyderabad             # configs/regional_profiles/hyderabad.yaml (places, dialect, names)
  dialect:
    name: dakhni_urdu
    intensity: 0.65
    english_mixing: 0.45
    urdu_influence: 0.70
    forced_slang: false
  character_names:
    mode: culturally_adaptive
    region: Hyderabad
    preserve_relationships: true
  storytelling:
    mode: creative_adaptation
    enhance_emotions: true
    enhance_comedy: true
    enhance_romance: true
    enhance_suspense: true
    enhance_tragedy: true
    preserve_story_logic: true
    preserve_character_motivations: true
    avoid_forced_humour: true
  audio:
    natural_delivery: true
    emotion_aware_tts: true
    conversational_pauses: true
    character_voice_consistency: true
    regional_pronunciation: true
  creative_references:
    enabled: true
    learn_storytelling_techniques: true
    allow_dialogue_copying: false
    allow_scene_copying: false
    require_original_expression: true
  models:                                 # per role; null = production.llm.model / polish_model
    analyzer: qwen3-32b
    writer: qwen3-32b
    naturalness_reviewer: sarvam-m
    screenplay_reviewer: qwen3-32b
  quality:
    min_score: 70
    max_rewrite_rounds: 1

creative:
  visual_style: photorealistic_cinematic
  character_style: realistic_fictional
  environment_style: cinematic
  preserve_scene_order: true
  preserve_camera_intent: true
  character_consistency: high

video:
  target_resolution: 1080x1920
  target_fps: 30
  target_aspect_ratio: "9:16"
  codec: h264

audio:
  target_language: hi
  voice_generation: true
  preserve_emotion: true
  speaker_voice_consistency: true

generation:
  replace_characters: true
  regenerate_backgrounds: true
  generate_new_shots: true
  lip_sync: true

quality:
  automatic_quality_checks: true
  review_low_confidence: true
  human_approval_required: true

sample:
  enabled: true
  duration_seconds: 90
  include_all_important_characters: true
  include_all_speaking_characters: true
  character_coverage: high
  narrative_coverage: full
  emotional_diversity: true
  generate_voice_previews: true
  generate_subtitles: true
  generate_quality_report: true
  resolution: 720x1280
  fps: 24
  visual_quality: balanced
  human_approval_required: true
  compare_profiles: [high]                # trailer only, best quality (add "balanced" to compare costs)

rights:
  purpose: self_improvement_learning
  distribution: private
  reuse_source_footage: true              # only for shots with no replacement character (private learning use)
  reuse_source_music_and_effects: true    # source sound effects/ambience only: production.mix.bed = effects (AI music removal)

# Analysis with the current best open models (v0.5). These differ from the legacy Mac run, so
# the analysis is recomputed on the GPU (the legacy import adopts only stages whose settings match).
analysis:
  audio: {stream_index: 0, sample_rate: 16000, channels: 1, codec: pcm_s16le}
  asr:
    model: funasr-paraformer-zh             # Mandarin ASR with sentence timestamps
    backend: funasr
    language: zh
    condition_on_previous_text: false
    fallback_model: faster-whisper-large-v3
  transcript_filters:
    drop_patterns: ["优优独播剧场", "YoYo Television Series Exclusive"]
  diarization:
    engine: diarizen
    model: diarizen-wavlm-large
    fallback_model: pyannote-speaker-diarization-community-1
  shots: {detector: pyscenedetect_content, threshold: 27.0, min_scene_len_frames: 15}
  frames: {strategy: uniform, fps: 2.0, max_per_shot: 12, width: 720, jpeg_quality: 85}
  face_detection:
    model: insightface-buffalo-l            # SCRFD detection + ArcFace identity in one pass
    confidence_threshold: 0.6
    padding: 0.35
    crop_size: 256
    jpeg_quality: 90
  face_embedding:
    model: insightface-buffalo-l
    det_size: 320
    execution_provider: CUDAExecutionProvider
    face_selection: largest
  clustering: {algorithm: dbscan, eps: 0.35, min_samples: 3, metric: cosine}
  character_database: {representatives_per_cluster: 5}
  alignment: {strong_ratio: 0.7, moderate_ratio: 0.3}
  emotion: {engine: emotion2vec}
  separation: {engine: bs_roformer}
  active_speaker: {method: light_asd}

notifications:
  enabled: false                          # enabled in M5 (approval service + VPS)
  approval:
    allow_cli_override: true              # `--approve-sample` stays as an audited admin override

production:
  llm:
    model: qwen3-32b                      # fits the 96 GB RTX PRO 6000; use qwen3-14b on GPUs < 80 GB
  mix:
    bed: effects                          # background music removed by AI (BandIt Plus); effects + ambience kept

storage:
  provider: local
  root: artifacts

compute:
  provider: local
  launcher: manual

budget:
  max_total_spend_usd: null               # open
  max_sample_spend_usd: null              # open
